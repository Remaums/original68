# Variante Nginx, si tu préfères (Caddy fait le HTTPS tout seul, Nginx a
# besoin de certbot : sudo certbot --nginx -d boutique.mondomaine.fr).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/original68
#   sudo ln -s /etc/nginx/sites-available/original68 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name boutique.mondomaine.fr;

    # certbot ajoutera ici la redirection vers le port 443 et les certificats.

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
